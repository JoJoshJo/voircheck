# Kept the two Render services awake while they were on the free plan (spec 5.16): a free instance sleeps after
# 15 idle minutes and the next visit waits 30-60 s for it (a fresh scan of a sleeping demo store took 77 s, Nov 4).
#
# Both services are on Starter (always on) since Nov 5, so the schedule is removed: no more pings. Pings to a free
# service would only spend the workspace's 750 free instance hours a month. The job stays for a manual run
# (Actions > Keep warm > Run workflow), e.g. to wake a service that was moved back to the free plan.
#
# Only GETs of public, read-only paths. No secrets, no checkout.
name: Keep warm

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping the app and the demo stores
        run: |
          for url in https://voircheck.com/api/health https://voircheck-stores.onrender.com/robots.txt; do
            # Up to 90 s: a sleeping instance takes 30-60 s to answer. A failed ping never fails the job.
            curl -sS -o /dev/null --max-time 90 -w "$url %{http_code} %{time_total}s\n" "$url" || echo "$url unreachable"
          done
