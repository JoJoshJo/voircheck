<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoirCheck</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="icons/ghost-32.png" alt="" width="24" height="24" />
      <span class="brand">VoirCheck</span>
    </header>
    <main>
      <p class="label" data-i18n="storeLabel"></p>
      <p id="host" class="host">…</p>
      <section id="saved" class="saved" hidden>
        <p class="label" data-i18n="savedLabel"></p>
        <p id="saved-verdict" class="saved-verdict"></p>
        <p id="saved-message" class="saved-message"></p>
        <p id="saved-date" class="saved-date"></p>
      </section>
      <button id="check" type="button" disabled data-i18n="checkButton"></button>
      <p id="note" class="note"></p>
    </main>
    <footer>
      <p class="muted" data-i18n="checkOnly"></p>
      <a id="how" href="https://voircheck.com/how-it-works" data-i18n="howLink"></a>
    </footer>
  </body>
</html>
